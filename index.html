<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA Chat - Campaign Sandbox</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <div class="app-container">
        <!-- Sidebar / Header -->
        <header class="app-header">
            <h1 class="logo">AURA</h1>
            <p class="subtitle">Campaign Interventions Sandbox</p>
        </header>

        <!-- Main Chat Area -->
        <main class="chat-container">
            <div class="chat-history" id="chat-history">
                <!-- Chat messages will appear here -->
                <div class="message bot-message">
                    <p>Hello! I'm AURA. Ask me anything about running personalized campaigns or interventions for your
                        user groups.</p>
                </div>
            </div>

            <div class="chat-input-container">
                <form id="chat-form" class="chat-form">
                    <input type="text" id="chat-input" class="chat-input"
                        placeholder="e.g., Run a campaign targeting users with diabetes concerns." autocomplete="off"
                        required>
                    <button type="submit" class="send-btn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </form>
            </div>
        </main>
    </div>
    <script src="app.js"></script>
</body>

</html>
